# Every push: build the arm64 image and smoke-test it against a real MongoDB.
# Push to `fofl`: also publish to GHCR and deploy to the Oracle VM (/opt/interview).
name: build-and-deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/phamvietbach2006-max/k71-interview-system

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name mongo-smoke --network smoke mongo:8
          docker run -d --name app-smoke --network smoke -p 127.0.0.1:5000:5000 \
            -e MONGODB_URI=mongodb://mongo-smoke:27017/smoke \
            -e JWT_SECRET=smoke-secret -e STAFF_PASSWORD=smoke-pass \
            "$IMAGE:${{ github.sha }}"
          status=""
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app-smoke)
            [ "$status" = healthy ] && break
            sleep 2
          done
          if [ "$status" != healthy ]; then
            echo "app did not become healthy (status: $status)"; docker logs app-smoke; exit 1
          fi
          code() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5000$1"; }
          check() { local got; got=$(code "$1"); echo "$1 -> $got"; [ "$got" = "$2" ] || { docker logs app-smoke; exit 1; }; }
          check /api/public/health 200
          check /api/public/config 200
          check /api/users 401
          curl -s http://127.0.0.1:5000/ | grep -q '<div id="root"' || { echo "index.html not served"; exit 1; }
          docker exec app-smoke id -un | grep -qx node || { echo "container is not running as node"; exit 1; }

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/fofl'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/fofl'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:fofl
          cache-from: type=gha

  deploy:
    needs: build
    if: github.ref == 'refs/heads/fofl'
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy stack files
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        run: scp deploy/compose.yml deploy/backup.sh deploy/uninstall.sh "$TARGET:/opt/interview/"

      - name: Deploy
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          TAG: ${{ github.sha }}
        run: |
          ssh "$TARGET" "IMAGE='$IMAGE' TAG='$TAG' bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/interview
          test -f .env || { echo "/opt/interview/.env missing - see docs/deploy-oracle.md"; exit 1; }
          prev=$(sed -n 's/^IMAGE_TAG=//p' .env)
          if grep -q '^IMAGE_TAG=' .env; then sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/" .env; else echo "IMAGE_TAG=$TAG" >> .env; fi
          [ -n "$prev" ] && [ "$prev" != "$TAG" ] && echo "$prev" > .prev_tag
          docker compose pull app
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
          # Remove old images of THIS repository only (never a host-wide prune: other projects live here)
          keep="$TAG fofl $(cat .prev_tag 2>/dev/null || true)"
          docker image ls "$IMAGE" --format '{{.Tag}}' | while read -r t; do
            case " $keep " in *" $t "*) ;; *) [ "$t" = "<none>" ] || docker image rm "$IMAGE:$t" || true ;; esac
          done
          docker image ls "$IMAGE" --filter dangling=true -q | xargs -r docker image rm || true
          EOF
